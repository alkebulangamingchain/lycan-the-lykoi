name: Unpack assets and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-site
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack _b64 bundle (if any) into the site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          if ls _b64/bundle.tgz.b64.part* >/dev/null 2>&1; then
            cat _b64/bundle.tgz.b64.part* | base64 -d > /tmp/bundle.tgz
            sha256sum /tmp/bundle.tgz
            tar -xzvf /tmp/bundle.tgz
            git rm -rq _b64
            git add -A
            git commit -m "Unpack binary site assets"
            git push origin HEAD:main
          else
            echo "nothing to unpack"
          fi
      - name: Publish main to gh-pages (GitHub Pages source)
        run: git push origin HEAD:refs/heads/gh-pages
